import java.security.KeyStore
import java.security.cert.X509Certificate
import java.util.Locale

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    // Release JS is minified before Hermes removes debug metadata/function names.
    extraPackagerArgs = ["--minify", "true"]
    hermesFlags = ["-O", "-g0", "-fstrip-function-names"]
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

// Keep production credentials in an ignored local file, user Gradle properties or CI secrets.
// Relative keystore paths are resolved from android/app.
def releaseSigningProperties = new Properties()
def releaseSigningFile = rootProject.file("release-signing.properties")
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withReader("UTF-8") { reader -> releaseSigningProperties.load(reader) }
}
// Priority: environment variable > Gradle property > ignored local properties > empty.
def releaseSetting = { String name ->
    providers.environmentVariable(name).orElse(providers.gradleProperty(name))
        .getOrElse(releaseSigningProperties.getProperty(name, ""))
}
def releaseStorePath = releaseSetting("WALLET_RELEASE_STORE_FILE")
def releaseStorePassword = releaseSetting("WALLET_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = releaseSetting("WALLET_RELEASE_KEY_ALIAS")
def releaseKeyPassword = releaseSetting("WALLET_RELEASE_KEY_PASSWORD")
def hasReleaseSigning = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { !it.isEmpty() }
def unsignedRelease = providers.gradleProperty("walletUnsignedRelease").getOrElse("false").toBoolean()

def validateReleaseSecurity = tasks.register("validateReleaseSecurity") {
    doLast {
        if (!hermesEnabled.toBoolean()) throw new IllegalStateException("Wallet release requires Hermes bytecode.")
        if (unsignedRelease) {
            logger.lifecycle("Building an UNSIGNED review artifact; it cannot be installed or published as-is.")
        } else {
            if (!hasReleaseSigning) throw new IllegalStateException("Release signing is required. Create the ignored android/release-signing.properties file or set the four WALLET_RELEASE_* values; use -PwalletUnsignedRelease=true only for an unsigned review artifact.")
            def signingFile = file(releaseStorePath)
            if (!signingFile.isFile() || signingFile.canonicalFile == file('debug.keystore').canonicalFile) {
                throw new IllegalStateException("Release must use an external production keystore.")
            }
            try {
                def store = KeyStore.getInstance(signingFile, releaseStorePassword.toCharArray())
                def certificate = store.getCertificate(releaseKeyAlias)
                if (!(certificate instanceof X509Certificate)) {
                    throw new IllegalStateException("A production X.509 signing certificate is required")
                }
                def subject = ((X509Certificate) certificate).subjectX500Principal.name
                if (subject.toLowerCase(Locale.ROOT).contains("cn=android debug")) {
                    throw new IllegalStateException("Invalid production certificate")
                }
            } catch (Exception ignored) {
                throw new IllegalStateException("Unable to validate production signing certificate; check the keystore and alias.")
            }
        }
    }
}
tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") task.dependsOn(validateReleaseSecurity)
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.dreamkey.wallet"
    defaultConfig {
        applicationId "com.dreamkey.wallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning && !unsignedRelease) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (hasReleaseSigning && !unsignedRelease) signingConfig signingConfigs.release
            debuggable false
            jniDebuggable false
            // Release packages only target physical ARM devices. Debug builds keep
            // all architectures configured in android/gradle.properties for
            // emulator support.
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // Document-start injection runs before website scripts on supported WebViews.
    implementation("androidx.webkit:webkit:1.9.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
